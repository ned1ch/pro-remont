services:
  db:
    image: postgres:16-alpine
    container_name: pro-remont-db
    environment:
      POSTGRES_DB: pro_remont
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55433:5432"
    volumes:
      - pro-remont-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pro_remont"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pro-remont-pgdata:
